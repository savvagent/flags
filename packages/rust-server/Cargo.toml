# An empty [workspace] makes this standalone crate its own workspace root. Without it, cargo
# searches parent directories for a workspace and can find an enclosing checkout's root
# Cargo.toml whose `exclude` list does not match this path (for example, in a git worktree
# nested inside the main checkout), and refuses to build.
[workspace]

[package]
name = "savvagent-flags"
version = "0.1.0"
edition = "2021"
authors = ["Savvagent Flags Team <support@savvagent.com>"]
description = "Rust Server SDK for Savvagent Flags feature flags with AI-powered error detection"
license = "MIT"
repository = "https://github.com/savvagent/flags"
homepage = "https://github.com/savvagent/flags"
documentation = "https://docs.rs/savvagent-flags"
keywords = ["feature-flags", "feature-toggles", "savvagent-flags", "ai"]
categories = ["web-programming", "api-bindings"]
readme = "README.md"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
